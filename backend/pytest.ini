[pytest]
# pytest configuration for Character Chatbot API tests

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Output options
addopts = 
    -v
    --strict-markers
    --strict-config
    --tb=short
    --color=yes
    -ra

# Markers
markers =
    api: Mark test as API endpoint test
    integration: Mark test as integration test
    slow: Mark test as slow running
    unit: Mark test as unit test

# Logging
log_cli = false
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

# Timeout
timeout = 30

# Timeout (install pytest-timeout to use)
# timeout = 30

# Coverage (if pytest-cov is installed)
# addopts = --cov=../core --cov=../api --cov-report=html --cov-report=term
