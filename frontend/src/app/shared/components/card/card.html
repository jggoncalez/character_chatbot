<div class="agent-card" (click)="onClick(cardConfig()!)" data-bs-dismiss="modal" aria-label="Close" >
    <div class="img-box">
        <img [src]="cardConfig()?.wayImg" class="card-img-top" alt="...">
    </div>
    <div class="agent-card-body">
        <h5 class="agent-card-title">{{cardConfig()?.agent}}</h5>
        <p class="agent-card-text">{{cardConfig()?.describe}}</p>
    </div>
</div>
