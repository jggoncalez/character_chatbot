<div class="container py-4">
    <header class="bg-light p-5 rounded-4 shadow-sm mb-5 text-center">
        <h1 class="display-5 fw-bold text-dark mb-3">
            BEM-VINDO À <span class="text-primary">character_chatbot</span>
        </h1>
        <p class="lead text-secondary mb-0">
            Antes de começar sua experiência, escolha um personagem.
        </p>
    </header>

    <main class="bg-white pb-5">
        <div class="d-flex align-items-center justify-content-between border-bottom pb-3 mb-4">
            <h2 class="h3 fw-semibold text-dark mb-0">
                Personagens mais populares
            </h2>
        </div>

        <div class="mb-5">
            <app-carousel [cards]="cards()"></app-carousel>
        </div>

        <div class="d-flex justify-content-center">
            <button class="btn btn-dark btn-lg px-5 shadow-sm rounded-pill" 
                    type="button" 
                    data-bs-toggle="modal" 
                    data-bs-target="#modalPesquisa">
                Veja mais personagens
            </button>
        </div>
    </main>

    <footer class="d-flex flex-wrap justify-content-between align-items-center py-4 mt-5 border-top">
        <div class="col-md-6 d-flex align-items-center">
            <span class="text-secondary text-sm">
                &copy; 2026 character_chatbot I.A. Todos os direitos reservados.
            </span>
        </div>

        <ul class="nav col-md-6 justify-content-end list-unstyled d-flex">
            <li class="ms-3">
                <a [href]="'/about-us'" class="btn btn-outline-secondary btn-sm rounded-pill px-4">
                    Sobre nós
                </a>
            </li>
        </ul>
    </footer>
</div>
