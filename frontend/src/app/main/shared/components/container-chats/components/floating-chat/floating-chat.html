<div
  [class]="isDark ? 'rounded-3 overflow-hidden d-flex flex-column shadow-lg border border-secondary bg-dark' : 'rounded-3 overflow-hidden d-flex flex-column shadow-lg border border-light-subtle bg-white'"
  [style.width.px]="300"
  [style.height]="isMinimized ? 'auto' : '380px'">

  <div class="d-flex align-items-center justify-content-between px-3 py-2"
      style="background: linear-gradient(135deg, #6a8ef0 0%, #a855f7 50%, #ec4899 100%); cursor: pointer;"
      (click)="toggleMinimize()">

    <div class="d-flex align-items-center gap-2">
      <div class="rounded-2 bg-dark bg-opacity-25 d-flex align-items-center justify-content-center"
          style="width: 34px; height: 34px;">
        <i class="bi bi-laptop-fill text-white"></i>
      </div>
      <div>
        <div class="fw-semibold text-white small">{{agentInput().agent}}</div>
        <div class="text-white-50" style="font-size: 0.7rem;">Online</div>
      </div>
    </div>

    <div class="d-flex align-items-center gap-2">
      <button class="btn btn-sm p-0 border-0 text-white opacity-75"
              style="line-height: 1;"
              (click)="$event.stopPropagation(); toggleMinimize()">
        <i [class]="isMinimized ? 'bi bi-fullscreen' : 'bi bi-fullscreen-exit'"></i>
      </button>
      <button class="btn btn-sm p-0 border-0 text-white opacity-75"
              style="line-height: 1;"
              (click)="$event.stopPropagation(); close()">
        <i class="bi bi-x-lg"></i>
      </button>
    </div>

  </div>
  @if(!isMinimized) {
    <div [class]="isDark ? 'flex-grow-1 overflow-y-auto p-3 bg-dark' : 'flex-grow-1 overflow-y-auto p-3  bg-white'">
        <app-conversation [agent]="agentInput().agent"></app-conversation>
    </div>

    <div [class]="isDark ? 'px-3 py-2 border-top border-secondary bg-dark' : 'px-3 py-2 border-top border-light-subtle bg-white'">
      <app-input-chat [agent]="agentInput().agent"></app-input-chat>
    </div>
  }

</div>
