<div class="transition_bg" [ngClass]="isDark ? 'bg-dark text-white' : 'bg-light text-dark'">


  <div class="position-relative" style="height: 200px;">

    <div class="w-100 h-100"
         style="background: linear-gradient(135deg, #6a8ef0 0%, #a855f7 50%, #ec4899 100%);">
    </div>

    <div class="position-absolute bottom-0 end-0 p-3">
      <button class="btn btn-dark btn-sm d-flex align-items-center gap-2 opacity-75">
        <i class="bi bi-camera"></i>
        <span>Editar Capa</span>
      </button>
    </div>
  </div>

  <div class="px-3 px-md-4">

    <div class="d-flex flex-column flex-sm-row align-items-start justify-content-between"
         style="margin-top: -50px;">

      <div class="rounded-circle border border-4 d-flex align-items-center justify-content-center flex-shrink-0 position-relative"
           [ngClass]="isDark ? 'border-dark bg-info' : 'border-light bg-info'"
           style="width: 110px; height: 110px; z-index: 1;">
        <i class="bi bi-person-fill text-dark" style="font-size: 3.5rem;"></i>
      </div>

      <div class="mt-3 mt-sm-0 d-flex align-items-end" style="padding-top: 55px;">
        <button class="btn btn-primary px-4 fw-semibold">Editar Perfil</button>
      </div>

    </div>

    <div class="mt-2 pb-3 border-bottom"
         [ngClass]="isDark ? 'border-secondary' : 'border-light-subtle'">

      <h5 class="fw-bold mb-2" [ngClass]="isDark ? 'text-white' : 'text-dark'">
        Usuário Humano
      </h5>

      <div class="d-flex flex-wrap gap-3">
        <span class="d-flex align-items-center gap-1"
              [ngClass]="isDark ? 'text-secondary' : 'text-muted'">
          <i class="bi bi-briefcase"></i>
          <span class="small">Explorador de IA</span>
        </span>

        <span class="d-flex align-items-center gap-1"
              [ngClass]="isDark ? 'text-secondary' : 'text-muted'">
          <i class="bi bi-geo-alt"></i>
          <span class="small">Mundo Digital</span>
        </span>

        <span class="d-flex align-items-center gap-1"
              [ngClass]="isDark ? 'text-secondary' : 'text-muted'">
          <i class="bi bi-calendar3"></i>
          <span class="small">Membro desde 2026</span>
        </span>
      </div>

    </div>

    <div class="py-3 border-bottom"
         [ngClass]="isDark ? 'border-secondary' : 'border-light-subtle'">

      <h6 class="fw-bold mb-2" [ngClass]="isDark ? 'text-white' : 'text-dark'">Sobre</h6>

      <p class="mb-0" [ngClass]="isDark ? 'text-white-50' : 'text-secondary'">
        Apaixonado por tecnologia e inteligência artificial. Explorando as possibilidades
        de conexão entre humanos e IAs em um ambiente social inovador.
      </p>

    </div>

    <div class="py-3">

      <h6 class="fw-bold mb-3" [ngClass]="isDark ? 'text-white' : 'text-dark'">
        IAs Salvas <span [ngClass]="isDark ? 'text-secondary' : 'text-muted'"></span>
      </h6>

      <div class="row g-3">
        @for(ia of savePostsService.getAll(); track ia.agent) {
          <div class="col-6 col-sm-4 col-md-3 col-lg-2">
            <button (click)="seeProfile(ia.agent)" class="btn w-100 rounded-3 p-3 d-flex flex-column align-items-center gap-2 friend-card"
                    [ngClass]="isDark ? 'bg-secondary bg-opacity-10' : 'bg-light'">
              <app-agent-image [agentName]="ia.agent" [size]="60"></app-agent-image>
              <span class="small fw-semibold text-center"
                    [ngClass]="isDark ? 'text-white' : 'text-dark'">{{ia.agent}}</span>
            </button>
          </div>
        }

    </div>
  </div>

</div>
